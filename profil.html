<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Fadia</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .profile-container {
            max-width: 600px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
        }

        h2 {
            text-align: center;
            color: #4A90E2;
            margin-bottom: 20px;
        }

        h3 {
            text-align: center;
            color: #888;
            margin-top: 0;
        }

        p {
            font-size: 16px;
            margin: 10px 0;
            padding-left: 10px;
            border-left: 4px solid #4A90E2;
            background-color: #f0f8ff;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <h3>Profil</h3>
        <h2>Fadia Nurcholifah</h2>
        <p><strong>TTL:</strong> Jakarta, 5 April 2006</p>
        <p><strong>Usia:</strong> 18 tahun</p>
        <p><strong>Zodiac:</strong> Aries</p>
        <p><strong>Alamat:</strong> Sepatan</p>
        <p><strong>Pekerjaan:</strong> UI/UX</p>
    </div>
</body>
</html>
